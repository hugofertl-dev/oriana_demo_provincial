# Configuración de Netlify para la demo de ORIANA
# Publica los archivos estáticos y expone la función en /api/tts

[build]
  # dist/ contiene SOLO lo publicable (ver scripts/stage_publish.sh):
  # publish="." exponía docs/, progress/, test/ y CLAUDE.md por URL.
  publish = "dist"
  command = "bash scripts/stage_publish.sh"
  functions = "netlify/functions"

# Las fotos (~fijas) se cachean fuerte: sin esto los 6 JPEG se revalidan en cada
# visita. Los HTML quedan con max-age=0 (default) a propósito: se actualizan al toque.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El frontend llama a /api/tts -> lo redirige a la función serverless
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

# El frontend llama a /api/chat -> función serverless del chat (Claude)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Telemetría: el frontend POSTea errores del cliente a /api/log
[[redirects]]
  from = "/api/log"
  to = "/.netlify/functions/log"
  status = 200
